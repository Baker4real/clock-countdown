name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publication_base:
        description: 'Ancestor commit or ref to check against the selected candidate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and contracts
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind publication diff range
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MANUAL_BASE: ${{ inputs.publication_base }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          $range = & .\tools\Test-CountdownPublicationDiff.ps1 -EventName $env:EVENT_NAME -PushBase $env:PUSH_BASE -PullRequestBase $env:PR_BASE -ManualBase $env:MANUAL_BASE -CandidateCommit $env:CANDIDATE_SHA -Json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $range.Valid) { throw ($range.Failures -join '; ') }
          "COUNTDOWN_DIFF_BASE=$($range.BaseCommit)" >> $env:GITHUB_ENV
          "COUNTDOWN_DIFF_CANDIDATE=$($range.CandidateCommit)" >> $env:GITHUB_ENV

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Run read-only build preflight
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\tools\Test-CountdownBuildPreflight.ps1 -Json
          $preflightExit = $LASTEXITCODE
          if ($preflightExit -ne 0) { exit $preflightExit }

      - name: Build C# artifacts
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Build-CountdownApplication.ps1
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) { exit $buildExit }

      - name: Run low-impact tooling and popup guards
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\tools\Invoke-CountdownSuiteLowImpact.ps1 -Stage ValidationHarness,Tooling -StageTimeoutSeconds 300
          $suiteExit = $LASTEXITCODE
          if ($suiteExit -ne 0) { exit $suiteExit }

      - name: Test release contract
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Countdown.Core.Tests.ps1 -ReleaseContractOnly
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - name: Test remote deployment transaction
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Countdown.Core.Tests.ps1 -RemoteDeploymentOnly
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - name: Test transfer ledger
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Countdown.TransferLedger.Tests.ps1
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - name: Test deployment status and checkout bytes
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File ./tools/Test-OfficeDeploymentStatus.ps1 -Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
