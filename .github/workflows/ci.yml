name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publication_base:
        description: 'Ancestor commit or ref to check against the selected candidate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and contracts
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable crash dumps for the application
        # validate-only occasionally exits 0xC0000409 (fast fail) and passes on rerun.
        # The runner is discarded after the job, so WER LocalDumps only affects this job.
        # The repository is public and so are its artifacts: minidumps only, no full memory.
        continue-on-error: true
        shell: pwsh
        run: |
          $werPath = 'SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          $current = Get-ItemProperty -LiteralPath "HKLM:\$werPath" -ErrorAction SilentlyContinue
          $policy = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting' -ErrorAction SilentlyContinue
          $service = Get-Service -Name WerSvc -ErrorAction SilentlyContinue
          Write-Output "WER before: Disabled=$($current.Disabled) DontShowUI=$($current.DontShowUI) PolicyDisabled=$($policy.Disabled) WerSvc=$($service.Status)/$($service.StartType)"
          if ($null -ne $service -and $service.StartType -eq 'Disabled') { Set-Service -Name WerSvc -StartupType Manual }
          $dumpFolder = Join-Path $env:RUNNER_TEMP 'crash-dumps'
          [void][IO.Directory]::CreateDirectory($dumpFolder)
          $dumps = [Microsoft.Win32.Registry]::LocalMachine.CreateSubKey("$werPath\LocalDumps\MinminCountdown.exe")
          try {
            $dumps.SetValue('DumpFolder', $dumpFolder, [Microsoft.Win32.RegistryValueKind]::ExpandString)
            $dumps.SetValue('DumpType', 1, [Microsoft.Win32.RegistryValueKind]::DWord)
            $dumps.SetValue('DumpCount', 5, [Microsoft.Win32.RegistryValueKind]::DWord)
          }
          finally { $dumps.Dispose() }
          # Nobody on the runner can dismiss a WER dialog.
          $wer = [Microsoft.Win32.Registry]::LocalMachine.CreateSubKey($werPath)
          try { $wer.SetValue('DontShowUI', 1, [Microsoft.Win32.RegistryValueKind]::DWord) }
          finally { $wer.Dispose() }
          Write-Output "LocalDumps for MinminCountdown.exe: minidump, up to 5, in $dumpFolder"

      - name: Bind publication diff range
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MANUAL_BASE: ${{ inputs.publication_base }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          $range = & .\tools\Test-CountdownPublicationDiff.ps1 -EventName $env:EVENT_NAME -PushBase $env:PUSH_BASE -PullRequestBase $env:PR_BASE -ManualBase $env:MANUAL_BASE -CandidateCommit $env:CANDIDATE_SHA -Json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $range.Valid) { throw ($range.Failures -join '; ') }
          "COUNTDOWN_DIFF_BASE=$($range.BaseCommit)" >> $env:GITHUB_ENV
          "COUNTDOWN_DIFF_CANDIDATE=$($range.CandidateCommit)" >> $env:GITHUB_ENV

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Run read-only build preflight
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\tools\Test-CountdownBuildPreflight.ps1 -Json
          $preflightExit = $LASTEXITCODE
          if ($preflightExit -ne 0) { exit $preflightExit }

      - name: Build C# artifacts
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Build-CountdownApplication.ps1
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) { exit $buildExit }

      - name: Check candidate windows before full regression
        shell: pwsh
        run: |
          $dllHash = (Get-FileHash ./app/MinminCountdown.dll -Algorithm SHA256).Hash
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File ./tools/Invoke-CountdownSuiteLowImpact.ps1 -Stage GeometryPreflight -AppPath (Join-Path $PWD 'app') -ExpectedDllSha256 $dllHash -StageTimeoutSeconds 90
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run low-impact tooling and popup guards
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\tools\Invoke-CountdownSuiteLowImpact.ps1 -Stage ValidationHarness,Tooling -StageTimeoutSeconds 300
          $suiteExit = $LASTEXITCODE
          if ($suiteExit -ne 0) { exit $suiteExit }

      - name: Preserve suite diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: suite-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/suite-runs/*.json
            logs/suite-runs/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare display for work-area geometry tests
        shell: pwsh
        run: |
          # The geometry fixtures cover a 1920x1032 work area. WPF also applies
          # the real desktop's native maximum tracking size to shown windows.
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Output "CI display: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1920 -or $bounds.Height -lt 1080) {
            throw 'The display cannot host the required work-area geometry fixtures.'
          }

      - name: Test release contract
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Countdown.Core.Tests.ps1 -ReleaseContractOnly
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - name: Test remote deployment transaction
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Countdown.Core.Tests.ps1 -RemoteDeploymentOnly
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - name: Test transfer ledger
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Countdown.TransferLedger.Tests.ps1
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - name: Test deployment status and checkout bytes
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File ./tools/Test-OfficeDeploymentStatus.ps1 -Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect crash evidence
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'crash-evidence'
          [void][IO.Directory]::CreateDirectory($evidence)
          # Application Error 1000 names the faulting module and offset, WER 1001 carries
          # the fast-fail code, .NET Runtime 1025/1026 carry managed messages and stacks.
          # The job times out after 30 minutes, so 40 minutes covers all of its steps.
          $events = @()
          try {
            $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-40) } -ErrorAction Stop |
              Where-Object { $_.ProviderName -in 'Application Error', 'Windows Error Reporting', '.NET Runtime' } |
              Sort-Object TimeCreated)
          }
          catch {
            if ($_.FullyQualifiedErrorId -notlike 'NoMatchingEventsFound*') { Write-Warning "Application event query failed: $($_.Exception.Message)" }
          }
          $eventText = @($events | ForEach-Object { "[$($_.TimeCreated.ToString('o'))] $($_.ProviderName) $($_.Id)`n$($_.Message)`n" })
          [IO.File]::WriteAllLines((Join-Path $evidence 'application-events.txt'), [string[]] $eventText)
          Write-Output "Crash-related application events: $($events.Count)"
          $eventText | Write-Output
          foreach ($source in @(
              @{ Path = (Join-Path $env:RUNNER_TEMP 'crash-dumps'); Name = 'dumps' },
              @{ Path = 'D:\agents\run-evidence\clock-countdown-validation'; Name = 'validation-evidence' })) {
            if (-not (Test-Path -LiteralPath $source.Path)) { continue }
            try { Copy-Item -LiteralPath $source.Path -Destination (Join-Path $evidence $source.Name) -Recurse -Force -ErrorAction Stop }
            catch { Write-Warning "Copying $($source.Path) failed: $($_.Exception.Message)" }
          }
          $files = @(Get-ChildItem -LiteralPath $evidence -Recurse -File)
          Write-Output ("Crash evidence: {0} files, {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB))

      - name: Upload crash evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: crash-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crash-evidence
          if-no-files-found: ignore
          retention-days: 14
