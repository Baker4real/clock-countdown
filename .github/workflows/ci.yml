name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and contracts
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Publish C# test artifacts
        shell: pwsh
        run: |
          $applicationArgs = @(
            'publish', '.\src\MinminCountdown\MinminCountdown.csproj',
            '--configuration', 'Release',
            '--runtime', 'win-x64',
            '--self-contained', 'true',
            '-p:PublishSingleFile=true',
            '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:IncludeSourceRevisionInInformationalVersion=false',
            '-p:DebugType=None',
            '-p:DebugSymbols=false',
            '--output', '.\app'
          )
          dotnet @applicationArgs
          $applicationExit = $LASTEXITCODE
          if ($applicationExit -ne 0) { exit $applicationExit }

          $verificationArgs = @(
            'publish', '.\src\MinminCountdown.Verification\MinminCountdown.Verification.csproj',
            '--configuration', 'Release',
            '--runtime', 'win-x64',
            '--self-contained', 'true',
            '-p:PublishSingleFile=true',
            '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:IncludeSourceRevisionInInformationalVersion=false',
            '-p:DebugType=None',
            '-p:DebugSymbols=false',
            '--output', '.\verification'
          )
          dotnet @verificationArgs
          $verificationExit = $LASTEXITCODE
          if ($verificationExit -ne 0) { exit $verificationExit }

      - name: Test release contract
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Countdown.Core.Tests.ps1 -ReleaseContractOnly
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - name: Test validation lifecycle
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Countdown.Core.Tests.ps1 -ValidationOnly
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - name: Test remote deployment transaction
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\Countdown.Core.Tests.ps1 -RemoteDeploymentOnly
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
